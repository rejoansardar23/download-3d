name: Bug report
description: Reproducible issue with a supported, rights-cleared fixture
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Do not share private asset links, signed URLs, cookies or restricted binary files."
  - type: input
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe error messages
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and synthetic/permitted fixture
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Python / Blender / browser versions
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, signed URL query strings and restricted asset data
          required: true
